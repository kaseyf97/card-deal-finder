<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="slab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c7d2fe"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0">
        <animate attributeName="stop-opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0">
        <animate attributeName="stop-opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 2 0; -1 0" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Graded card slab outline -->
  <rect x="5" y="4" width="22" height="24" rx="2" fill="none" stroke="url(#slab)" stroke-width="1.5"/>

  <!-- Card inside slab -->
  <rect x="8" y="7" width="16" height="18" rx="1" fill="url(#card)"/>

  <!-- Shine overlay -->
  <rect x="8" y="7" width="16" height="18" rx="1" fill="url(#shine)" opacity="0.7"/>

  <!-- Grade label bar at bottom of slab -->
  <rect x="5" y="23" width="22" height="5" rx="0" fill="#4f46e5" opacity="0.8"/>
  <rect x="5" y="23" width="22" height="5" rx="0" fill="none" stroke="url(#slab)" stroke-width="0.5"/>

  <!-- Grade text "10" -->
  <text x="16" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="3.5" font-weight="bold" fill="#e0e7ff">PSA 10</text>
</svg>
