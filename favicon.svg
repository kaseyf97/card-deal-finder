<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="slabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1d5db"/>
      <stop offset="100%" style="stop-color:#9ca3af"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#bfdbfe"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0.5">
        <animate attributeName="stop-opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Slab outer body (clear acrylic — light gray) -->
  <rect x="5" y="1" width="22" height="30" rx="1" fill="url(#slabBg)" stroke="#6b7280" stroke-width="0.75"/>

  <!-- PSA label at top — white background, red border -->
  <rect x="5" y="1" width="22" height="9" rx="1" fill="white" stroke="#dc2626" stroke-width="1"/>
  <rect x="5" y="8" width="22" height="1" fill="#dc2626"/>

  <!-- PSA text -->
  <text x="8.5" y="6.5" font-family="Arial Black, sans-serif" font-size="4" font-weight="900" fill="#dc2626" letter-spacing="0.3">PSA</text>

  <!-- Grade number -->
  <text x="23" y="7" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="5.5" font-weight="900" fill="#1e3a8a">10</text>

  <!-- Card visible inside slab (below label) -->
  <rect x="7.5" y="10.5" width="17" height="18.5" rx="0.5" fill="url(#cardFill)"/>

  <!-- Card inner content lines (simplified card art) -->
  <rect x="9.5" y="12.5" width="13" height="9" rx="0.3" fill="#bfdbfe" opacity="0.7"/>
  <rect x="9.5" y="23" width="13" height="1.2" rx="0.3" fill="#93c5fd" opacity="0.6"/>
  <rect x="9.5" y="25" width="8" height="1" rx="0.3" fill="#93c5fd" opacity="0.5"/>

  <!-- Shimmer over whole slab -->
  <rect x="5" y="1" width="22" height="30" rx="1" fill="url(#shimmer)"/>
</svg>
