<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0.45">
        <animate attributeName="stop-opacity" values="0;0.45;0" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Card body -->
  <rect x="4" y="2" width="24" height="28" rx="3" fill="url(#cardGrad)"/>

  <!-- Inner border -->
  <rect x="6.5" y="4.5" width="19" height="23" rx="1.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.75"/>

  <!-- Dollar sign -->
  <text x="16" y="21" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="white" opacity="0.95">$</text>

  <!-- Top accent line -->
  <rect x="9" y="7" width="14" height="1.5" rx="0.75" fill="rgba(255,255,255,0.5)"/>

  <!-- Bottom accent line -->
  <rect x="9" y="23.5" width="14" height="1.5" rx="0.75" fill="rgba(255,255,255,0.5)"/>

  <!-- Shimmer -->
  <rect x="4" y="2" width="24" height="28" rx="3" fill="url(#shineGrad)"/>
</svg>
